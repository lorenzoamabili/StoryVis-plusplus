services:
  - type: web
    name: storyvis-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: CORS_ORIGIN
        value: https://storyvis.netlify.app
      - key: OLLAMA_HOST
        sync: false
      - key: OLLAMA_MODEL
        value: llama3.2
