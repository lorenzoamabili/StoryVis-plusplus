<app-menu-bar [canvas]="canvas" [canvasComparison]="canvasComparison" [studyStarted]="studyStarted"
  [IDcreator]="IDcreator"></app-menu-bar>

<!-- ── Main tool layout ─────────────────────────────────────────────────── -->
<div class="tool-layout">

  <!-- Canvas fills all remaining space -->
  <div class="canvas-area">
    <app-brainvis-canvas
      [ngClass]="!provenance.settings.isComparisonMode ? 'normal' : 'comparison'"
      #canvas [studyStarted]="studyStarted">
    </app-brainvis-canvas>
    <app-brainvis-canvas-comparison
      [ngClass]="!provenance.settings.isComparisonMode ? 'normal' : 'comparison'"
      #canvasComparison [studyStarted]="studyStarted"
      (aiCaptions)="aiPanel.generateReport()">
    </app-brainvis-canvas-comparison>

    <!-- Story deck toggle handle at bottom edge of canvas -->
    <button class="bottom-toggle-btn" (click)="bottomOpen = !bottomOpen"
            [class.open]="bottomOpen"
            matTooltip="{{ bottomOpen ? 'Close story deck' : 'Open story deck' }}">
      <mat-icon>{{ bottomOpen ? 'keyboard_arrow_down' : 'auto_stories' }}</mat-icon>
      <span>Story Deck</span>
    </button>
  </div>

  <!-- ── Right icon strip (always visible) ──────────────────────────────── -->
  <div class="panel-strip" *ngIf="!isNoProvGraph">

    <button class="strip-btn" [class.strip-active]="rightOpen && activePanel==='prov'"
            (click)="togglePanel('prov')"
            matTooltip="Provenance graph — exploration history" matTooltipPosition="left">
      <mat-icon>account_tree</mat-icon>
    </button>

    <button class="strip-btn" [class.strip-active]="rightOpen && activePanel==='bm'"
            (click)="togglePanel('bm')"
            matTooltip="Bookmarks" matTooltipPosition="left">
      <mat-icon>bookmarks</mat-icon>
    </button>

    <button class="strip-btn" [class.strip-active]="rightOpen && activePanel==='ref'"
            (click)="togglePanel('ref')"
            matTooltip="Reflections" matTooltipPosition="left">
      <mat-icon>psychology</mat-icon>
    </button>

    <button class="strip-btn" [class.strip-active]="rightOpen && activePanel==='ai'"
            (click)="togglePanel('ai')"
            matTooltip="AI Assistant" matTooltipPosition="left">
      <mat-icon>auto_awesome</mat-icon>
    </button>

  </div>

  <!-- ── Right panel ────────────────────────────────────────────────────── -->
  <div class="right-panel" [class.right-panel-open]="rightOpen" *ngIf="!isNoProvGraph">

    <!-- Panel header with close button -->
    <div class="rp-header">
      <mat-icon class="rp-header-icon">
        {{ activePanel === 'prov' ? 'account_tree'
         : activePanel === 'bm'   ? 'bookmarks'
         : activePanel === 'ref'  ? 'psychology'
         : 'auto_awesome' }}
      </mat-icon>
      <span class="rp-header-label">
        {{ activePanel === 'prov' ? 'Provenance'
         : activePanel === 'bm'   ? 'Bookmarks'
         : activePanel === 'ref'  ? 'Reflections'
         : 'AI Assistant' }}
      </span>
      <button mat-icon-button class="rp-close-btn" (click)="rightOpen = false"
              matTooltip="Close panel">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <!-- Panels shown/hidden via CSS — keeps components alive -->
    <div class="rp-content">
      <div [hidden]="activePanel !== 'prov'">
        <app-provenance-visualization></app-provenance-visualization>
        <app-provenance-visualization-comparison
          *ngIf="provenance.settings.isEducationMode || provenance.settings.isComparisonMode">
        </app-provenance-visualization-comparison>
      </div>

      <div [hidden]="activePanel !== 'bm'">
        <app-bookmark-panel></app-bookmark-panel>
      </div>

      <div [hidden]="activePanel !== 'ref'">
        <app-reflection-panel></app-reflection-panel>
      </div>

      <div class="ai-wrap" [hidden]="activePanel !== 'ai'">
        <app-ai-assistant-panel #aiPanel
          [comparisonCanvas]="canvasComparison"
          [slidesComponent]="slides">
        </app-ai-assistant-panel>
      </div>
    </div>

  </div>

</div>

<!-- ── Bottom panel (story deck) ──────────────────────────────────────── -->
<div class="bottom-panel" [class.bottom-panel-open]="bottomOpen">
  <app-provenance-slides [canvas]="canvas" #slides *ngIf="!isNoProvGraph"></app-provenance-slides>
  <app-text-report *ngIf="isNoProvGraph"></app-text-report>
</div>

<app-tutorial></app-tutorial>
