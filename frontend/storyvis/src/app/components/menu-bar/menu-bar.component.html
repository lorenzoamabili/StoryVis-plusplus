<mat-toolbar class="app-toolbar" color="primary">
  <mat-toolbar-row class="toolbar-row">

    <!-- ── Dataset ──────────────────────────────────────────────────────── -->
    <mat-form-field class="toolbar-select dataset-select"
      matTooltip="Switch the imaging dataset loaded in the viewer.">
      <mat-label>Dataset</mat-label>
      <mat-select [(ngModel)]="selectedDataUrl" (selectionChange)="onDataSourceChange($event)">
        <mat-option *ngFor="let ds of dataSources" [value]="ds.url">{{ ds.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <ng-container *ngIf="showCustomInput">
      <input class="custom-url-input" [(ngModel)]="customUrl"
        placeholder="Paste NIfTI / DICOM URL…" (keyup.enter)="loadCustomUrl()" />
      <button mat-icon-button class="tool-btn" (click)="loadCustomUrl()" matTooltip="Load URL">
        <mat-icon>arrow_forward</mat-icon>
      </button>
    </ng-container>

    <span class="toolbar-sep"></span>

    <!-- ── Window / Level ────────────────────────────────────────────────── -->
    <span class="wl-group" id="tutorial-wl-slider">
      <app-styled-slider-practice *ngIf="!studyStarted"></app-styled-slider-practice>
      <app-styled-slider-exploration *ngIf="studyStarted"></app-styled-slider-exploration>
    </span>

    <mat-form-field id="tutorial-wl-preset" class="toolbar-select wl-preset-select"
      matTooltip="Apply a preset window/level for common tissue types.">
      <mat-label>W/L</mat-label>
      <mat-select (selectionChange)="canvas.presetWindowLevel($event)">
        <mat-option *ngFor="let wl of wlSettings" [value]="wl">{{ wl.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <span class="toolbar-sep"></span>

    <!-- ── Measurement tools ─────────────────────────────────────────────── -->
    <div class="tool-group" role="toolbar" aria-label="Measurement tools">

      <mat-button-toggle id="tutorial-ruler" class="tool-toggle mobile-hide"
        [checked]="settings.rulerMode" (change)="settings.rulerMode = $event.source.checked"
        matTooltip="Ruler — click two points to measure distance in mm">
        <mat-icon>straighten</mat-icon>
      </mat-button-toggle>

      <mat-button-toggle id="tutorial-angle" class="tool-toggle mobile-hide"
        [checked]="settings.angleMode" (change)="settings.angleMode = $event.source.checked"
        matTooltip="Angle — click three points to measure an angle">
        <mat-icon>square_foot</mat-icon>
      </mat-button-toggle>

      <mat-button-toggle id="tutorial-voxelprobe" class="tool-toggle mobile-hide"
        [checked]="settings.voxelprobeMode" (change)="settings.voxelprobeMode = $event.source.checked"
        matTooltip="HU Probe — click a voxel to read its Hounsfield Unit value">
        <mat-icon>colorize</mat-icon>
      </mat-button-toggle>

      <mat-button-toggle id="tutorial-annotation" class="tool-toggle mobile-hide"
        [checked]="settings.annotationMode" (change)="settings.annotationMode = $event.source.checked"
        matTooltip="Annotate — click to place a text label on the image">
        <mat-icon>speaker_notes</mat-icon>
      </mat-button-toggle>

      <mat-button-toggle class="tool-toggle mobile-hide"
        [checked]="settings.loupeMode" (change)="settings.loupeOn = $event.source.checked"
        matTooltip="Loupe — hover a 2D panel for a 3× magnified view">
        <mat-icon>search</mat-icon>
      </mat-button-toggle>

    </div>

    <span class="toolbar-sep"></span>

    <!-- ── Cine play/pause ───────────────────────────────────────────────── -->
    <button mat-icon-button class="tool-btn cine-btn"
      [class.tool-active]="canvas.cineActive"
      (click)="canvas.toggleCine()"
      [matTooltip]="canvas.cineActive ? 'Pause cine' : 'Play cine — auto-scroll slices'">
      <mat-icon>{{ canvas.cineActive ? 'pause_circle' : 'play_circle_outline' }}</mat-icon>
    </button>

    <!-- Flex spacer -->
    <span class="flex-spacer"></span>

    <!-- ── Provenance actions ─────────────────────────────────────────────── -->
    <button mat-icon-button class="tool-btn"
      (click)="bookmarkCurrent(false)"
      matTooltip="Bookmark (B) — save this state with a label">
      <mat-icon>bookmark_border</mat-icon>
    </button>

    <button mat-icon-button class="tool-btn"
      (click)="bookmarkCurrent(true)"
      matTooltip="Mark phase — tag this state as the start of a new analysis phase">
      <mat-icon>flag</mat-icon>
    </button>

    <button mat-icon-button class="tool-btn"
      (click)="canvas.openReflection()"
      matTooltip="Reflect (R) — attach a note to the current state">
      <mat-icon>psychology</mat-icon>
    </button>

    <span class="toolbar-sep"></span>

    <!-- ── More menu ─────────────────────────────────────────────────────── -->
    <button mat-icon-button class="tool-btn" [matMenuTriggerFor]="moreMenu"
      matTooltip="More tools and settings">
      <mat-icon>more_horiz</mat-icon>
    </button>

    <mat-menu #moreMenu="matMenu" class="app-more-menu" xPosition="before">

      <button mat-menu-item disabled class="more-section-label">Playback</button>
      <button mat-menu-item [matMenuTriggerFor]="cineSpeedMenu">
        <mat-icon>speed</mat-icon><span>Cine speed</span>
      </button>
      <button mat-menu-item [matMenuTriggerFor]="cinePlaneMenu">
        <mat-icon>flip</mat-icon>
        <span>Plane — {{ canvas.cinePlaneChoice | titlecase }}</span>
      </button>

      <mat-divider></mat-divider>
      <button mat-menu-item disabled class="more-section-label">History</button>
      <button mat-menu-item (click)="canvas.undoStep()">
        <mat-icon>undo</mat-icon><span>Undo</span>
      </button>
      <button mat-menu-item (click)="canvas.redoStep()">
        <mat-icon>redo</mat-icon><span>Redo</span>
      </button>

      <mat-divider></mat-divider>
      <button mat-menu-item disabled class="more-section-label">Session</button>
      <button mat-menu-item (click)="canvas.openDebrief()">
        <mat-icon>rate_review</mat-icon><span>Session Reflection</span>
      </button>
      <button mat-menu-item (click)="startTutorial()">
        <mat-icon>help_outline</mat-icon><span>Interactive Tour</span>
      </button>
      <button mat-menu-item (click)="openShortcuts()">
        <mat-icon>keyboard</mat-icon><span>Keyboard Shortcuts</span>
      </button>

      <mat-divider></mat-divider>
      <button mat-menu-item disabled class="more-section-label">Advanced</button>
      <button mat-menu-item (click)="settings.isAdvancedMode = !settings.isAdvancedMode">
        <mat-icon>{{ settings.isAdvancedMode ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
        <span>Advanced Mode</span>
      </button>
      <ng-container *ngIf="settings.isAdvancedMode">
        <button mat-menu-item (click)="canvas.displayDatacomics()">
          <mat-icon>grid_on</mat-icon><span>Data-Comics Editor</span>
        </button>
        <button mat-menu-item [matMenuTriggerFor]="compareMenu">
          <mat-icon>compare_arrows</mat-icon><span>Comparison Mode</span>
        </button>
        <button mat-menu-item [matMenuTriggerFor]="loadAnalysisMenu" (menuOpened)="load()">
          <mat-icon>folder_open</mat-icon><span>Load Saved Analysis</span>
        </button>
        <button mat-menu-item [matMenuTriggerFor]="loadStoryMenu" (menuOpened)="load()">
          <mat-icon>auto_stories</mat-icon><span>Load Saved Story</span>
        </button>
      </ng-container>

    </mat-menu>

    <!-- Cine speed sub-menu -->
    <mat-menu #cineSpeedMenu="matMenu">
      <button mat-menu-item (click)="canvas.setCineSpeed(2)">2 fps — slow</button>
      <button mat-menu-item (click)="canvas.setCineSpeed(5)">5 fps — default</button>
      <button mat-menu-item (click)="canvas.setCineSpeed(10)">10 fps</button>
      <button mat-menu-item (click)="canvas.setCineSpeed(20)">20 fps — fast</button>
    </mat-menu>

    <!-- Cine plane sub-menu -->
    <mat-menu #cinePlaneMenu="matMenu">
      <button mat-menu-item (click)="canvas.cinePlaneChoice = 'axial'">Axial</button>
      <button mat-menu-item (click)="canvas.cinePlaneChoice = 'coronal'">Coronal</button>
      <button mat-menu-item (click)="canvas.cinePlaneChoice = 'sagittal'">Sagittal</button>
    </mat-menu>

    <!-- Comparison sub-menu (advanced) -->
    <mat-menu #compareMenu="matMenu">
      <button mat-menu-item *ngFor="let ds of dataSources" (click)="canvas.loadData(ds.url)">
        {{ ds.name }}
      </button>
    </mat-menu>

    <!-- Load analysis sub-menu -->
    <mat-menu #loadAnalysisMenu="matMenu">
      <ng-container *ngIf="graphs.length; else noGraphs">
        <button mat-menu-item *ngFor="let g of graphs" (click)="loadGraph(g)">
          {{ g.IDcreator }} — {{ g.timeEnd | date:'short' }}
        </button>
      </ng-container>
      <ng-template #noGraphs>
        <button mat-menu-item disabled>No saved analyses</button>
      </ng-template>
    </mat-menu>

    <!-- Load story sub-menu -->
    <mat-menu #loadStoryMenu="matMenu">
      <ng-container *ngIf="stories.length; else noStories">
        <button mat-menu-item *ngFor="let s of stories" (click)="loadStory(s)">
          {{ s.IDcreator }} — {{ s._id }}
        </button>
      </ng-container>
      <ng-template #noStories>
        <button mat-menu-item disabled>No saved stories</button>
      </ng-template>
    </mat-menu>

    <!-- ── Save + Clock ───────────────────────────────────────────────────── -->
    <button mat-icon-button class="tool-btn" [class.save-active]="saving"
      (click)="saveSession()"
      matTooltip="Save session">
      <mat-icon>{{ saving ? 'check' : 'save' }}</mat-icon>
    </button>

    <span class="toolbar-clock">{{ now }}</span>

  </mat-toolbar-row>
</mat-toolbar>
